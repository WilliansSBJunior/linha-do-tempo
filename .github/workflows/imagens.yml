name: Imagens

on:
  workflow_dispatch:
  push:
    paths:
      - "data/imagens/manifest.json"

permissions:
  contents: write

concurrency:
  group: imagens
  cancel-in-progress: false

jobs:
  baixar:
    # o commit do bot leva [skip ci]; esta guarda é redundante de propósito
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install Pillow requests

      - name: Baixar imagens do manifesto
        run: python scripts/baixar_imagens.py

      - name: Commit e push se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imagens
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Imagens: baixa fotos do manifesto [skip ci]"
            git push
          fi
